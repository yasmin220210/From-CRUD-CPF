<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Beauty - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Criar Conta 💄</h1>
        <form id="formCadastro" onsubmit="event.preventDefault();">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required placeholder="Ex: Maria">
                </div>
                <div class="form-group">
                    <label for="sobrenome">Sobrenome *</label>
                    <input type="text" id="sobrenome" required placeholder="Ex: Silva">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" required placeholder="(11) 99999-9999">
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" required placeholder="seuemail@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="rua">Rua *</label>
                    <input type="text" id="rua" required placeholder="Rua / Avenida">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" required placeholder="00000-000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" required placeholder="Sua cidade">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="estado">Estado *</label>
                    <input type="text" id="estado" maxlength="2" required placeholder="UF">
                </div>
            </div>

            <button type="button" onclick="enviarDados()">Cadastrar</button>
        </form>

        <a href="login.html" class="login-link">Já tem uma conta? Voltar ao Login</a>
    </div>

    <script src="/FORM-CRUD-CPF/public/post.js"></script>
</body>
</html>
