    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

                <input type="email" id="loginEmail" placeholder="seuemail@email.com" required>

                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••" required>
            </div>

            <button type="button" onclick="alert('Login efetuado com sucesso!')">Entrar</button>
        </form>

        <a href="/FORM-CRUD-CPF/public/index.html" class="login-link">Não tem uma conta? Cadastre-se aqui</a>

        <div style="margin-top: 25px; border-top: 1px dashed #f8d7da; padding-top: 15px;">
            <a href="/FORM-CRUD-CPF/public/admin.html" class="login-link" style="color: #b8506f; font-weight: bold;"> Acesso Restrito (Admin)</a>
        </div>
    </div>
</body>
</html>
